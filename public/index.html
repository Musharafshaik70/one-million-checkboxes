<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>One Million Checkboxes</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: #0d0d0d;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 2rem 1rem;
            }

            h1 {
                font-size: 2.25rem;
                font-weight: 700;
                margin-bottom: 2rem;
                text-align: center;
                letter-spacing: -0.025em;
            }

            #container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
                gap: 10px;
                width: 100%;
                max-width: 800px;
                padding: 1.5rem;
                background-color: #161618;
                border: 1px solid #27272a;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            /* Toast Error Notification Styling */
            #toast-container {
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                z-index: 1000;
            }

            .toast {
                background-color: #1c1917;
                color: #f87171;
                border: 1px solid #7f1d1d;
                padding: 0.85rem 1.25rem;
                border-radius: 8px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
                font-size: 0.9rem;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                opacity: 0;
                transform: translateY(10px);
                transition: all 0.25s ease-in-out;
            }

            .toast.show {
                opacity: 1;
                transform: translateY(0);
            }

            /* Modern native checkbox styling */
            input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 24px;
                height: 24px;
                background-color: #27272a;
                border: 1px solid #3f3f46;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.15s ease-in-out;
                display: grid;
                place-content: center;
                outline: none;
            }

            input[type="checkbox"]:hover {
                background-color: #3f3f46;
                border-color: #52525b;
                transform: scale(1.08);
            }

            input[type="checkbox"]:checked {
                background-color: #6366f1;
                border-color: #6366f1;
            }

            /* Custom checkmark icon inside the checkbox */
            input[type="checkbox"]:checked::before {
                content: "";
                width: 10px;
                height: 6px;
                border-left: 2px solid #ffffff;
                border-bottom: 2px solid #ffffff;
                transform: rotate(-45deg) translate(1px, -1px);
            }

            input[type="checkbox"]:focus-visible {
                box-shadow:
                    0 0 0 2px #0d0d0d,
                    0 0 0 4px #6366f1;
            }
        </style>
    </head>
    <body>
        <h1>One Million Checkboxes</h1>
        <div id="container"></div>

        <!-- Notification container -->
        <div id="toast-container"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            const socket = io();
            const container = document.getElementById("container");
            const toastContainer = document.getElementById("toast-container");

            // Utility function to trigger error toasts
            function showErrorToast(message) {
                const toast = document.createElement("div");
                toast.className = "toast";
                toast.innerHTML = `⚠️ ${message}`;

                toastContainer.appendChild(toast);

                //  smooth fade-in
                setTimeout(() => toast.classList.add("show"), 10);

                setTimeout(() => {
                    toast.classList.remove("show");
                    toast.addEventListener("transitionend", () => toast.remove());
                }, 3500);
            }

            // when client receives error from server (e.g. rate limiting)
            socket.on("server-error", (data) => {
                const errorMsg = typeof data === "string" ? data : data.error || "Action rate limited!";
                showErrorToast(errorMsg);
            });

            // client receives data from server and updates the checkbox fields
            socket.on("server:checkbox:changed", (data) => {
                console.log("Socket Server Event", data);
                const { index, checked } = data;
                const input = document.getElementById(`checkbox-${index}`);
                if (input) input.checked = checked;
            });

            async function fetchStateFromServer() {
                try {
                    const response = await fetch("/checkboxes", { method: "GET" });
                    const data = await response.json();
                    if (data && data.checkboxes) {
                        //when you get data, only then you rerender
                        container.replaceChildren();
                        data.checkboxes.forEach((serverValue, index) => {
                            const input = document.createElement("input");
                            input.type = "checkbox";
                            input.id = `checkbox-${index}`;
                            input.checked = serverValue;

                            input.addEventListener("change", (event) => {
                                const checked = event.target.checked;
                                console.log("Checkbox changed", { index, checked });
                                socket.emit("client:checkbox:changed", { index, checked });
                                //rerender DOM to update client state due to rate limiting.
                                fetchStateFromServer();
                            });

                            container.append(input);
                        });
                    }
                } catch (err) {
                    showErrorToast("Failed to load initial state from server.");
                }
            }

            // When a new client connects, load initial state
            window.addEventListener("load", async () => {
                fetchStateFromServer();
            });
        </script>
    </body>
</html>
